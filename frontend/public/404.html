<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      const repo = "/car_inventory1";
      const path = location.pathname.replace(repo, "");
      const query = location.search;

      location.replace(
        repo + "/?redirect=" + encodeURIComponent(path + query)
      );
    </script>
  </head>
  <body></body>
</html>
