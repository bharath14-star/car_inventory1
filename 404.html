<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Car Portal</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g., http://www.foo.tld/one/two?a=b&c=d#qwe, becomes
      // http://www.foo.tld/?/one/two&a=b~and~c=d#qwe
      // Note: this 404.html file must be at least 512 bytes for it to work
      // with Internet Explorer (it is currently > 512 bytes)

      // If you're creating a Project Pages site and NOT using a custom domain,
      // then set pathSegmentsToKeep to 1 (enterprise users may need to set it to > 1).
      // This way the code will only replace the route part and not the real path to
      // the GitHub project.  See https://github.com/rafgraph/spa-github-pages/issues/3
      // for more information.  A Project Pages site has a real path of at least /
      // followed by a project name, path name, or username like 'myproject'.
      // This will be in the path of the URL like this:
      // http://username.github.io/myproject/     <- pathSegmentsToKeep = 1
      //                                        also covers the following URLs:
      // http://username.github.io/myproject/one
      // http://username.github.io/myproject/one/two
      // http://username.github.io/myproject/one/two?a=b&c=d#qwe
      // https://username.github.io/myproject/   <- pathSegmentsToKeep = 1
      //                                        also covers the following URLs:
      // https://username.github.io/myproject/one
      // http://username.github.io/myproject/one/two
      // http://username.github.io/myproject/one/two?a=b&c=d#qwe
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );

    </script>
  </head>
  <body>
  </body>
</html>
